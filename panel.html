<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Dossier</title>
  <script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
  <style>
    :root { --bleu:#002060; --or:#FDB913; --ink:#1a1a1a; --mut:#5b6478; --line:#cfd5e2; --soft:#f4f6fa; }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; padding:14px; font:13px/1.4 "Open Sans","Segoe UI",Arial,sans-serif; color:var(--ink); }
    h1 { font-size:18px; color:var(--bleu); margin:0 0 2px; }
    .sub { color:var(--mut); font-size:12px; margin-bottom:12px; }
    label { display:block; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); margin:12px 0 4px; }
    input[type=text], input[type=date] { width:100%; border:1px solid var(--line); border-radius:4px; padding:7px 8px; font:inherit; }
    .seg { display:flex; flex-wrap:wrap; gap:4px; }
    .seg button { border:1px solid var(--line); background:#fff; border-radius:12px; padding:3px 9px; font:inherit; font-size:12px; cursor:pointer; }
    .seg button[aria-pressed=true] { background:var(--bleu); color:#fff; border-color:var(--bleu); }
    .seg button i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; vertical-align:-1px; border:1px solid rgba(0,0,0,.2); }
    .row { display:flex; gap:8px; margin-top:16px; }
    .btn { flex:1; border:0; border-radius:5px; padding:9px; font:inherit; font-weight:700; cursor:pointer; }
    .primary { background:var(--bleu); color:#fff; }
    .ghost { background:var(--soft); color:var(--bleu); }
    .danger { background:#fff; color:#c8341f; border:1px solid #f0b8ae; }
    .status { margin-top:12px; font-size:12px; color:var(--mut); min-height:18px; }
    .status.err { color:#c8341f; }
    .confirm { display:none; margin-top:8px; padding:8px; background:#fff4f2; border:1px solid #f0b8ae; border-radius:5px; }
    .confirm.on { display:block; }
    .tools { border-top:1px solid var(--line); margin-top:18px; padding-top:10px; }
    .chk { display:flex; align-items:center; gap:6px; margin-top:12px; }
    .av { margin-top:14px; border:1px solid var(--line); border-radius:6px; padding:8px; background:var(--soft); }
    .av-ttl { font-weight:700; color:var(--bleu); margin-bottom:6px; }
    .tache { display:grid; grid-template-columns: 70px 1fr 18px; grid-template-areas: "res liv del" "pri ech ech" "fait fait fait";
      gap:4px; align-items:center; padding:6px; margin-bottom:6px; background:#fff; border:1px solid var(--line); border-radius:5px; }
    .t-fait { grid-area:fait; display:flex; justify-content:flex-start; align-items:center; gap:6px; margin:0; font-size:12px; text-transform:none; letter-spacing:0; font-weight:700; cursor:pointer; }
    .etat.ko { color:#c8341f; } .etat.ok { color:#1e8e4e; }
    .t-fait input, .okf input { width:auto !important; margin:0; }
    .t-res { grid-area:res; } .t-liv { grid-area:liv; } .t-pri { grid-area:pri; } .t-ech { grid-area:ech; } .del { grid-area:del; }
    .tache select, .tache input { width:100%; border:1px solid var(--line); border-radius:4px; padding:4px 3px; font:inherit; font-size:12px; background:#fff; }
    .tache .del { border:0; background:none; color:#c8341f; font-size:16px; cursor:pointer; padding:0; }
    .add { margin-top:4px; border:1px dashed var(--bleu); background:#fff; color:var(--bleu); border-radius:5px; padding:5px; width:100%; font:inherit; font-weight:700; cursor:pointer; }
    .og { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); margin:12px 0 4px; }
    .oi { display:grid; grid-template-columns: 1fr 26px 26px; gap:4px; align-items:center; background:#fff; border:1px solid var(--line); border-radius:5px; padding:5px 6px; margin-bottom:4px; }
    .oi .t { font-weight:600; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .oi .m { font-size:11px; color:var(--mut); }
    .oi.fait { background:#e9f6ee; border-color:#1e8e4e; }
    .oi .okf { display:inline-flex; align-items:center; gap:4px; margin:3px 0 0 8px; font-size:11px; font-weight:700; text-transform:none; letter-spacing:0; cursor:pointer; }
    .oi .lg { margin-top:3px; font:inherit; font-size:11px; border:1px solid var(--line); border-radius:4px; padding:1px 3px; background:#fff; }
    .oi button { border:1px solid var(--line); background:var(--soft); border-radius:4px; cursor:pointer; font-size:12px; padding:2px 0; }
    button:focus-visible, input:focus-visible { outline:2px solid var(--or); outline-offset:1px; }
  </style>
</head>
<body>
  <div id="ver" style="float:right;font-size:10px;color:#9aa0a6">v25</div>
  <div id="vueOrdre" hidden>
    <h1 id="ordreTtl">Ordre de traitement</h1>
    <div class="sub">Flèches pour changer l'ordre, puis « Enregistrer l'ordre ». La zone 3 suit cet ordre dans chaque case.</div>
    <div id="ordreListe"></div>
    <div class="row">
      <button class="btn primary" id="ordreSave">Enregistrer l'ordre</button>
      <button class="btn ghost" id="ordreAuto">Ordre automatique</button>
    </div>
    <div class="row"><button class="btn ghost" id="ordreRetour">← Retour au dossier</button></div>
    <div class="status" id="ordreStatus"></div>
  </div>
  <div id="vueDossier">
  <h1 id="ttl">Nouveau dossier</h1>
  <div class="sub" id="sub">Clique une pastille sur le board pour la modifier.</div>

  <label for="titre">Client · site</label>
  <input type="text" id="titre" placeholder="ex. SCANIA Angers" autocomplete="off">

  <label>Pilote</label><div class="seg" id="pilote"></div>
  <label>Enjeu</label><div class="seg" id="enjeu"></div>
  <label>Priorité commerciale (zone 2)</label><div class="seg" id="priorite"></div>

  <div class="av">
    <div class="av-ttl">Avant-vente</div>
    <div id="taches"></div>
    <button type="button" class="add" id="addTache">+ Ajouter une ressource</button>
  </div>
  <div class="av">
    <div class="av-ttl">Tableau de chasse</div>
    <div class="chk" style="margin-top:0"><input type="checkbox" id="chasse"><label for="chasse" style="margin:0;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink)">Dans le tableau de chasse</label></div>
    <div class="row" style="margin-top:6px;gap:6px">
      <select id="chasseTrim" style="flex:1;border:1px solid var(--line);border-radius:4px;padding:5px;font:inherit"></select>
      <input type="number" id="jcrm" placeholder="n° jCRM" style="flex:1;border:1px solid var(--line);border-radius:4px;padding:5px;font:inherit">
    </div>
    <input type="text" id="suivi" placeholder="Suivi / échéance annoncée (ex. Go de principe, attente banque)" style="width:100%;margin-top:6px;border:1px solid var(--line);border-radius:4px;padding:6px;font:inherit;font-size:12px">
    <div class="sub" id="chasseInfo" style="margin:4px 0 0"></div>
  </div>
  <div class="chk"><input type="checkbox" id="carsat"><label for="carsat" style="margin:0;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink)">Dossier CARSAT</label></div>

  <div class="row">
    <button class="btn primary" id="save">Enregistrer</button>
    <button class="btn ghost" id="reset">Nouveau</button>
  </div>
  <div class="row" id="delRow" hidden>
    <button class="btn danger" id="del">Supprimer ce dossier</button>
  </div>
  <div class="confirm" id="confirm">Supprimer définitivement ce dossier du board ?
    <div class="row"><button class="btn danger" id="delYes">Oui, supprimer</button><button class="btn ghost" id="delNo">Annuler</button></div>
  </div>

  <div class="status" id="status"></div>

  <div class="tools">
    <div class="row" style="margin-top:0">
      <button class="btn ghost" id="init">Préparer le board</button>
      <button class="btn ghost" id="relayout">Ranger</button>
    </div>
    <div class="row">
      <button class="btn ghost" id="import">Importer les dossiers (import.json)</button>
    </div>
  </div>

  </div>
  <script type="module" src="panel.js?v=25"></script>
</body>
</html>
